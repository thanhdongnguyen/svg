<!doctype html><meta charset="utf-8"><title>SVG quality laboratory</title>
<style>body{font:14px system-ui;margin:24px;background:#f4f4f4;color:#151515}header{position:sticky;top:0;padding:16px;background:white;z-index:2}select,button{font:inherit;padding:8px}#gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cell{overflow:auto;border:1px solid #bbb;background:white;height:560px}.cell h3{position:sticky;top:0;margin:0;background:#eee;padding:8px}.cell img{display:block;max-width:none}body.black .cell{background:#000}pre{white-space:pre-wrap;font-size:12px}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px}.small{max-height:260px;overflow:auto}</style>
<header><h1>SVG quality laboratory</h1><label>Image <select id="fixture"></select></label> <label>Quality <select id="quality"><option>balanced</option><option>maximum</option><option>fast</option></select></label> <button id="run">Compare selected</button> <button id="all">Run corpus</button> <label>Zoom <select id="zoom"><option value="fit">Fit</option><option value="1">100%</option><option value="2">200%</option><option value="4">400%</option></select></label> <label>Background <select id="background"><option>white</option><option>black</option></select></label> <span id="status">Ready</span></header>
<div id="gallery"></div><pre id="selected">No result</pre><h2>Corpus results</h2><pre id="results" class="small">Not run</pre>
<script type="module">
import {sanitizeSvg} from './sanitize.js';
const fixture=document.querySelector('#fixture'),quality=document.querySelector('#quality'),zoom=document.querySelector('#zoom'),background=document.querySelector('#background'),gallery=document.querySelector('#gallery'),selected=document.querySelector('#selected');
const svg=(body,w=256,h=256)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${body}</svg>`;
const specs={
 'curves':svg('<path fill="#176bba" fill-rule="evenodd" d="M128 12A116 116 0 1 1 127.99 12ZM128 60A68 68 0 1 0 128.01 60Z"/><path fill="#ed735d" d="M13 240Q85 72 243 237Q137 164 13 240Z"/>'),
 'thin-details':svg('<path fill="#fff" d="M0 0H256V256H0Z"/><path fill="#1a345c" fill-rule="evenodd" d="M20 20H236V126H20ZM24 24V122H232V24Z M30 30H90V90H30ZM31 31V89H89V31Z"/><path stroke="#1574b5" stroke-width="1" fill="none" d="M8 145L245 151M8 162Q128 110 245 177M10 205L220 190"/><path fill="#dc6956" d="M20 218H22V241H20ZM40 218H44V241H40ZM60 218H68V241H60Z"/><circle fill="#15375b" cx="210" cy="211" r="2"/><circle fill="#15375b" cx="220" cy="224" r="1"/>'),
 'touching-colors':svg('<path fill="#e1bf55" d="M0 0H256V256H0Z"/><path fill="#1a799b" d="M0 0H128Q245 128 128 256H0Z"/><path fill="#bb5070" d="M0 0H128Q245 128 128 256H256V0Z"/><path fill="#283157" d="M110 100L240 180L100 230Z"/>'),
 'alpha-layers':svg('<path fill="#346dc4" opacity="0.5" d="M20 20H175V175H20Z"/><path fill="#df565a" opacity="0.6" d="M95 80H235V230H95Z"/><circle fill="#30b285" opacity="0.2" cx="72" cy="187" r="52"/>'),
 'radial-gradient':svg('<defs><radialGradient id="g"><stop stop-color="#ed9c63"/><stop offset=".5" stop-color="#ce5679"/><stop offset="1" stop-color="#23396c"/></radialGradient></defs><circle fill="url(#g)" cx="128" cy="128" r="112"/>'),
 'alpha-linear':svg('<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="180" y2="130"><stop stop-color="#1e50c8" stop-opacity="0"/><stop offset="1" stop-color="#1e50c8" stop-opacity=".8"/></linearGradient></defs><path fill="url(#g)" d="M0 0H256V256H0Z"/>'),
 'alpha-ellipse':svg('<defs><radialGradient id="g" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="matrix(90 30 -20 50 87 133)"><stop stop-color="#1e50c8" stop-opacity=".73"/><stop offset="1" stop-color="#1e50c8" stop-opacity="0"/></radialGradient></defs><path fill="url(#g)" d="M0 0H256V256H0Z"/>'),
 'alpha-shadow':svg('<defs><filter id="s"><feGaussianBlur stdDeviation="15"/></filter></defs><path fill="#1e50c8" filter="url(#s)" d="M70 70H160V155H70Z"/>'),
 'curves-jpeg':null,
};
const files=['interior-seam','koi','soft-alpha','gradient','logo-alpha','portrait','landscape'];if(window.qualityLabPhoto)files.unshift('astronaut');const names=[...files,...Object.keys(specs)];fixture.innerHTML=names.map(n=>`<option>${n}</option>`).join('');
let sources=new Map(), cache=new Map(), results=[],active=[];
async function image(url){let i=new Image();i.src=url;await i.decode();return i;}
async function source(name){if(sources.has(name))return sources.get(name);let file,truth;
 if(name in specs){truth=URL.createObjectURL(new Blob([specs[name]??specs.curves],{type:'image/svg+xml'}));const im=await image(truth),c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);const b=await new Promise(r=>c.toBlob(r,name==='curves-jpeg'?'image/jpeg':'image/png',.85));file=new File([b],name+(name==='curves-jpeg'?'.jpg':'.png'),{type:b.type});if(name==='curves-jpeg'){URL.revokeObjectURL(truth);truth=undefined;}}
 else {const b=await(await fetch(name+'.png')).blob();file=new File([b],name+'.png',{type:'image/png'});}
 const url=URL.createObjectURL(file),im=await image(url);const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let weight=0,visible=0,sum=[0,0,0];for(let i=0;i<d.length;i+=4){let a=d[i+3]/255,w=a*a;weight+=w;if(a)visible++;for(let j=0;j<3;j++)sum[j]+=d[i+j]*w;}let color=sum.map(v=>Math.round(v/weight)),sq=0,max=0;for(let i=0;i<d.length;i+=4)for(let j=0;j<3;j++){let e=Math.abs(d[i+j]-color[j])*d[i+3]/255;max=Math.max(max,e);sq+=e*e;}const hueDiagnostic={color,max,rms:Math.sqrt(sq/(visible*3))};const s={file,url,truth,hueDiagnostic,width:im.naturalWidth,height:im.naturalHeight};sources.set(name,s);return s;}
async function convert(engine,s,q){const worker=new Worker('./'+engine+'.js',{type:'module'});return await new Promise((resolve,reject)=>{let timer=setTimeout(()=>{worker.terminate();reject(Error('worker deadline'));},30000);worker.onerror=e=>{clearTimeout(timer);worker.terminate();reject(Error(e.message))};worker.onmessage=({data})=>{if(data.type==='result'||data.type==='error'){clearTimeout(timer);worker.terminate();if(data.type==='error')reject(Error(data.message));else{data.result.svg=sanitizeSvg(data.result.svg,s.width,s.height);resolve(data.result);}}};worker.postMessage({id:1,file:s.file,settings:{quality:q,mode:'color',colors:{fast:12,balanced:32,maximum:64}[q],threshold:128}});});}
async function pixels(url,w,h){const im=await image(url),c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0,w,h);return ctx.getImageData(0,0,w,h).data;}
function diff(a,b){let alpha=0,sum=0,max=0,bad=0;for(let i=0;i<a.length;i+=4){let x=a[i+3]/255,y=b[i+3]/255;alpha+=Math.abs(x-y);let error=0;for(let j=0;j<3;j++){let black=a[i+j]*x-b[i+j]*y,white=black+255*(y-x);sum+=black*black+white*white;error=Math.max(error,Math.abs(black),Math.abs(white));}max=Math.max(max,error);if(error>24)bad++;}return{alphaMAE:alpha/(a.length/4),compositeRMSE:Math.sqrt(sum/(a.length/4*6)),pixelsOver24:bad/(a.length/4),max};}
async function run(name,q){document.querySelector("#status").textContent='Running '+name+' '+q;const s=await source(name),row={name,quality:q,width:s.width,height:s.height,hueDiagnostic:s.hueDiagnostic},urls={Source:s.url};for(const engine of ['baseline','candidate']){try{const r=await convert(engine,s,q),url=URL.createObjectURL(new Blob([r.svg],{type:'image/svg+xml'}));urls[engine]=url;const scales=[];for(const scale of s.width>1000?[1,2]:[1,2,4]){scales.push({scale,reference:scale>1&&s.truth?'vector ground truth':'decoded raster',...diff(await pixels(scale>1&&s.truth?s.truth:s.url,s.width*scale,s.height*scale),await pixels(url,s.width*scale,s.height*scale))});}row[engine]={...r.metrics,bytes:new Blob([r.svg]).size,scales};}catch(e){row[engine]={error:e.message}}}cache.set(name+q,{row,urls,s});document.querySelector("#status").textContent='Finished '+name+' '+q;return row;}
function show(name,q){const c=cache.get(name+q);if(!c)return;gallery.innerHTML=Object.entries(c.urls).map(([label,url])=>`<div class="cell"><h3>${label}</h3><img alt="${label} ${name}" src="${url}" style="width:${c.s.width*(zoom.value==='fit'?Math.min(1,(gallery.clientWidth/3-16)/c.s.width):Number(zoom.value))}px;height:${c.s.height*(zoom.value==='fit'?Math.min(1,(gallery.clientWidth/3-16)/c.s.width):Number(zoom.value))}px"></div>`).join('');selected.textContent=JSON.stringify(c.row,null,2);}

document.querySelector('#run').onclick=async()=>{try{await run(fixture.value,quality.value);show(fixture.value,quality.value);}catch(e){document.querySelector("#status").textContent=e.message}};
document.querySelector('#all').onclick=async()=>{results=[];for(const name of names)for(const q of ['fast','balanced','maximum']){results.push(await run(name,q));document.querySelector('#results').textContent=JSON.stringify(results);show(name,q);}document.querySelector("#status").textContent='Corpus complete: '+results.length;};
zoom.onchange=()=>show(fixture.value,quality.value);background.onchange=()=>document.body.classList.toggle('black',background.value==='black');fixture.onchange=()=>show(fixture.value,quality.value);quality.onchange=()=>show(fixture.value,quality.value);
</script>
